<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollektiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#ffffff;
  --primary:#5174c6;
  --primary-dark:rgb(85, 95, 209);
  --primary-soft:#5174c6;
  --bg:#090b11;
  --bg-alt:#101218;
  --panel:#141821;
  --panel-strong:#1a1d29;
  --line:rgba(255,255,255,0.08);
  --text-soft:#b8bdd0;
  --text-softer:#8d92a8;
  --offwhite:#f3f4f8;
  --red:#ff7d6f;
  --evergreen:#5174c6;
  --evergreen-light:#5174c6;
  --chartreuse:#c4b5fd;
  --mint:#5174c6;
  --paper:#0f1720;
  --radius:18px;
  --shadow:0 18px 48px rgba(1, 2, 6, 0.5);
  --shadow-soft:0 16px 32px rgba(0,0,0,0.28);
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:var(--sans); background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button, input, textarea, [data-action]{ transition:all 0.2s ease; }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important; } }
#boot-loading{ min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--text-soft); font-size:14px; width:100%; }

/* Layout */
#app{ display:flex; min-height:100vh; width:100%; }
#sidebar{ width:252px; flex-shrink:0; background:var(--bg-alt); color:var(--offwhite); display:flex; flex-direction:column; padding:26px 18px; box-shadow: inset -1px 0 0 rgba(255,255,255,0.04); }
#main{ flex:1; min-width:0; position:relative; }
#content{ max-width:940px; margin:0 auto; padding:42px 30px 90px; }

/* Focus */
[data-action]:focus-visible{ outline:2px solid var(--evergreen); outline-offset:2px; border-radius:8px; }
#sidebar [data-action]:focus-visible{ outline-color:var(--chartreuse); }
input:focus-visible, textarea:focus-visible{ outline:none; border-color:var(--evergreen); box-shadow:0 0 0 3px rgba(139,92,246,0.18); }
input:focus, textarea:focus{ outline:none; border-color:var(--evergreen); }

/* Brand & Nav */
.brand{ display:flex; align-items:center; gap:9px; margin-bottom:32px; color:inherit; }
.brand::before{ content:"K"; width:30px; height:30px; display:grid; place-items:center; border-radius:10px; background:var(--primary); color:var(--offwhite); font-family:var(--serif); font-weight:700; box-shadow:0 8px 24px rgba(139,92,246,0.3); border:1px solid rgba(255,255,255,0.08); }
.brand span{ font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:0.02em; }
.nav{ display:flex; flex-direction:column; gap:4px; }
.nav-link{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14.5px; font-weight:500; color:rgba(236,244,239,0.7); border-left:3px solid transparent; }
.nav-link:hover{ background:rgba(255,255,255,0.04); color:var(--offwhite); transform:translateX(2px); }
.nav-link.active{ background:rgba(139,92,246,0.12); color:var(--primary-soft); border-left-color:var(--primary); box-shadow:inset 0 0 0 1px rgba(139,92,246,0.15); }
/* Ensure consistent placement and alignment of icon + label in sidebar nav */
.nav-link{ min-height:44px; }
.nav-link svg{ width:18px; height:18px; display:block; flex-shrink:0; }
.nav-link span{ display:inline-block; white-space:nowrap; vertical-align:middle; }
.member-card{ display:flex; align-items:center; gap:10px; padding:12px 13px; border-radius:14px; background:rgba(255,255,255,0.02); margin-top:auto; cursor:pointer; border:1px solid rgba(255,255,255,0.06); box-shadow:0 8px 24px rgba(0,0,0,0.18); }
.member-card:hover{ background:rgba(255,255,255,0.07); transform:translateY(-1px); }
.avatar{ width:36px; height:36px; border-radius:50%; background:var(--primary); color:var(--offwhite); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--serif); flex-shrink:0; font-size:14px; box-shadow:0 8px 18px rgba(139,92,246,0.22); }
.avatar-lg{ width:56px; height:56px; font-size:19px; }
.trust-line{ font-size:11px; color:rgba(236,244,239,0.4); text-align:center; margin-top:14px; }
.guest-pill{ font-size:11.5px; color:rgba(236,244,239,0.55); text-align:center; margin-top:14px; line-height:1.5; }
.guest-pill span{ text-decoration:underline; cursor:pointer; color:var(--chartreuse); }

/* Typography */
.page-title{ font-family:var(--serif); font-size:32px; font-weight:600; margin:0 0 8px; line-height:1.15; }
.page-sub{ color:var(--text-soft); font-size:15px; margin:0 0 30px; max-width:620px; line-height:1.55; }
.section-title{ font-family:var(--serif); font-size:20px; font-weight:600; margin:0 0 12px; }
.section{ margin-bottom:38px; }

/* Cards */
.card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-soft); }
.card:hover{ box-shadow:0 18px 36px rgba(0,0,0,0.22); transform:translateY(-1px); }
.hr{ height:1px; background:linear-gradient(90deg, var(--line), rgba(139,92,246,0.08)); margin:14px 0; }

/* Buttons */
.btn{ display:inline-flex; align-items:center; gap:6px; border:none; border-radius:12px; padding:10px 16px; font-family:var(--sans); font-weight:700; font-size:13.5px; cursor:pointer; box-shadow:0 10px 20px rgba(13, 24, 31, 0.3); }
.btn-primary{ background:var(--primary); color:var(--offwhite); }
.btn-primary:hover{ background:var(--primary-dark); transform:translateY(-1px); box-shadow:0 12px 24px rgba(139,92,246,0.22); }
.btn-primary:disabled{ opacity:0.55; cursor:default; transform:none; }
.btn-secondary{ background:rgba(139,92,246,0.06); border:1.5px solid rgba(139,92,246,0.28); color:var(--primary-soft); }
.btn-secondary:hover{ background:rgba(139,92,246,0.12); transform:translateY(-1px); }
.btn-ghost{ background:transparent; color:var(--evergreen-light); padding:8px 4px; text-decoration:underline; }
.btn-block{ width:100%; justify-content:center; }

/* Chips */
.chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:100px; background:var(--mint); color:var(--ink); font-size:12.5px; font-weight:500; }
.chip-guide{ background:var(--chartreuse); color:var(--ink); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; padding:3px 8px; border-radius:100px; display:inline-flex; align-items:center; gap:3px; }
.chip-helpful{ background:var(--chartreuse); font-weight:700; display:inline-flex; align-items:center; gap:4px; }
.chip-can{ background:var(--chartreuse); }
.chip-removable{ padding-right:6px; }
.chip-x{ cursor:pointer; opacity:0.55; font-weight:700; margin-left:2px; }
.chip-x:hover{ opacity:1; }
.chip-select{ cursor:pointer; background:var(--offwhite); border:1.5px solid var(--line); color:var(--panel-strong); }
.chip-select.chip-selected{ background:var(--evergreen); color:var(--offwhite); border-color:var(--evergreen); }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
.seal{ width:12px; height:12px; flex-shrink:0; }
.mark-helpful{ font-size:11.5px; color:var(--evergreen); text-decoration:underline; cursor:pointer; font-weight:600; }

/* Tabs */
.tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.tab{ padding:9px 14px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--text-soft); border-bottom:2px solid transparent; margin-bottom:-1px; border-radius:10px 10px 0 0; }
.tab:hover{ background:rgba(139,92,246,0.05); }
.tab.active{ color:var(--evergreen-light); border-bottom-color:var(--chartreuse); background:rgba(139,92,246,0.08); }

/* Accordion */
.acc-item{ border-bottom:1px solid var(--line); padding:13px 0; cursor:pointer; }
.acc-item:last-child{ border-bottom:none; }
.acc-item:hover .acc-head{ color:var(--evergreen-light); }
.acc-head{ display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:14.5px; }
.acc-body{ color:var(--text-soft); font-size:13.5px; margin-top:8px; line-height:1.55; }

/* Theme banner */
.theme-banner{ background:var(--panel-strong); color:var(--offwhite); border-radius:var(--radius); padding:26px; box-shadow:0 18px 34px rgba(0,0,0,0.25); border:1px solid rgba(139,92,246,0.18); }
.theme-banner .section-title{ color:var(--offwhite); margin-top:6px; }
.theme-tag{ display:inline-block; background:var(--primary); color:var(--offwhite); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:4px 10px; border-radius:100px; }
.theme-steps{ display:flex; flex-direction:column; gap:7px; font-size:14px; margin-top:12px; color:rgba(236,244,239,0.9); }
.theme-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.theme-banner .btn-secondary{ border-color:rgba(255,255,255,0.22); color:var(--offwhite); }
.theme-banner .btn-secondary:hover{ background:rgba(255,255,255,0.06); }

/* Digest */
.digest-text{ font-family:var(--serif); font-size:16.5px; font-weight:500; line-height:1.5; color:var(--ink); }
.digest-by{ font-size:12px; color:var(--text-softer); margin-top:5px; }

/* Roles */
.role-row{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
.role-row:last-child{ border-bottom:none; }
.role-title{ font-weight:600; font-size:14.5px; }
.role-note{ font-size:13px; color:var(--text-soft); margin-top:3px; }
.role-range{ font-family:var(--serif); font-weight:600; color:var(--evergreen); white-space:nowrap; font-size:15px; }
.ranges-note{ font-size:12px; color:var(--text-softer); margin-top:8px; }

/* Guides */
.guide-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
.guide-top{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.guide-name{ font-weight:600; font-size:14.5px; }
.guide-role{ font-size:12.5px; color:var(--text-soft); margin-top:2px; }
.guide-focus{ font-size:13px; margin-top:8px; line-height:1.45; }

/* Circles */
.circle-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
.circle-card{ cursor:pointer; }
.circle-card:hover{ transform:translateY(-2px); }
.circle-desc{ font-size:13.5px; color:var(--text-soft); margin-bottom:14px; line-height:1.45; }
.circle-count{ font-size:12px; color:var(--text-softer); }
.crumb{ font-size:13px; color:var(--evergreen); cursor:pointer; margin-bottom:16px; font-weight:600; display:inline-block; }
.thread-row{ padding:16px 20px; border-bottom:1px solid var(--line); cursor:pointer; }
.thread-row:last-child{ border-bottom:none; }
.thread-title{ font-weight:600; font-size:14.5px; margin-bottom:5px; }
.thread-meta{ font-size:12px; color:var(--text-softer); display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
.dot{ color:var(--text-softer); }
.empty-state{ padding:34px; text-align:center; color:var(--text-softer); font-size:14px; }
.share-note{ font-size:12px; color:var(--text-softer); margin-top:10px; }
.signin-prompt{ padding:14px 20px; background:var(--mint); border-radius:10px; font-size:13.5px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.signin-prompt span[data-action]{ font-weight:700; text-decoration:underline; cursor:pointer; }

/* Thread detail */
.reply{ padding:15px 0; border-bottom:1px solid var(--line); }
.reply:last-child{ border-bottom:none; }
.reply-author{ font-weight:600; color:var(--ink); }
.reply-body{ margin-top:6px; font-size:14px; line-height:1.55; }

/* Forms */
label{ font-size:11.5px; font-weight:600; color:var(--text-soft); margin-bottom:5px; display:block; text-transform:uppercase; letter-spacing:0.03em; }
input[ type=text], input[type=email], input[type=password], textarea, input[type=file]{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; font-family:var(--sans); font-size:14px; background:rgba(9,18,22,0.7); color:var(--ink); box-shadow:inset 0 1px 2px rgba(0,0,0,0.3); }
input[type=text]:hover, input[type=email]:hover, input[type=password]:hover, textarea:hover, input[type=file]:hover{ border-color:rgba(139,92,246,0.45); }
textarea{ resize:vertical; min-height:72px; }
.saved-tick{ font-size:11px; color:var(--evergreen-light); font-weight:600; opacity:0; transition:opacity .3s; display:block; margin-top:4px; }
.saved-tick.show{ opacity:1; }
.field{ margin-bottom:14px; }
.field:last-child{ margin-bottom:0; }
.form-error{ font-size:12.5px; color:var(--red); margin-top:10px; line-height:1.5; }
.form-error:empty{ display:none; }

/* Profile */
.upload-profile-picture{ display:flex; align-items:center; gap:12px;
}
.profile-header{ display:flex; align-items:center; gap:16px; margin-bottom:10px; }
.profile-name{ display:flex; align-items:center; gap:10px; }
.edit-link{ font-size:12.5px; font-weight:500; color:var(--evergreen); cursor:pointer; text-decoration:underline; }
.work-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
.goal-field{ margin-bottom:8px; max-width:440px; }
.career-card{ display:flex; flex-direction:column; gap:16px; }
.proj-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:14px; }
.proj-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.proj-title{ font-weight:600; font-size:14.5px; }
.proj-desc{ font-size:13.5px; color:var(--text-soft); margin-top:6px; line-height:1.5; }
.proj-link{ font-size:12.5px; margin-top:8px; color:var(--evergreen); word-break:break-all; }
.contrib-row{ padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; }
.contrib-row:last-child{ border-bottom:none; }
.recog-text{ font-family:var(--serif); font-style:italic; font-size:15px; line-height:1.5; }
.recog-from{ font-size:12px; font-style:normal; font-family:var(--sans); color:var(--text-softer); margin-top:4px; }
.milestone-row{ display:flex; align-items:center; gap:10px; padding:8px 0; cursor:pointer; font-size:14px; }
.milestone-row input{ width:16px; height:16px; accent-color:var(--evergreen); cursor:pointer; }
.milestone-done{ text-decoration:line-through; color:var(--text-softer); }
.danger-zone{ text-align:center; font-size:12.5px; color:var(--text-softer); margin-top:44px; }
.danger-zone [data-action]{ text-decoration:underline; cursor:pointer; }
.danger-zone [data-action="confirm-logout"]{ color:var(--red); font-weight:600; }

/* Opportunities */
.opp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
.opp-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.opp-title{ font-weight:600; font-size:14.5px; }
.opp-company{ font-size:13px; color:var(--text-soft); margin-top:2px; }
.opp-loc{ font-size:12.5px; color:var(--text-softer); margin-top:10px; }
.pay{ font-family:var(--serif); font-weight:600; color:var(--evergreen); margin-top:6px; font-size:16px; }
.opp-blurb{ font-size:13.5px; margin-top:8px; line-height:1.5; }
.verified-badge{ font-size:11.5px; color:var(--evergreen-light); font-weight:600; margin-top:12px; display:flex; align-items:center; gap:5px; }

/* Auth screen */
#authscreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; width:100%; }
.auth-card{ background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:38px; max-width:440px; width:100%; box-shadow:var(--shadow); }
.auth-title{ font-family:var(--serif); font-size:28px; text-align:center; line-height:1.2; margin:0 0 10px; }
.auth-sub{ text-align:center; color:var(--text-soft); font-size:14px; margin:0 0 24px; line-height:1.5; }
.auth-tabs{ display:flex; border:1.5px solid var(--line); border-radius:12px; padding:3px; margin-bottom:22px; }
.auth-tab{ flex:1; text-align:center; padding:8px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--text-soft); }
.auth-tab.active{ background:var(--evergreen); color:var(--offwhite); }
.member-type-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
.type-option{ border:1.5px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; }
.type-option.selected{ border-color:var(--evergreen); background:var(--mint); }
.type-label{ font-weight:600; font-size:13px; }
.type-need{ font-size:11.5px; color:var(--text-soft); margin-top:3px; line-height:1.4; }
.skip-link{ text-align:center; margin-top:16px; font-size:13px; color:var(--text-soft); text-decoration:underline; cursor:pointer; }
.legal-links{ display:flex; justify-content:center; gap:12px; margin-top:18px; font-size:12.5px; color:var(--text-soft); flex-wrap:wrap; }
.legal-links span{ cursor:pointer; text-decoration:underline; }
.legal-footer{ margin-top:auto; padding-top:18px; border-top:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; justify-content:center; font-size:11.5px; color:var(--text-softer); }
/* Sidebar-specific legal footer should not push content; override when in #sidebar */
#sidebar .legal-footer{ margin-top:8px; padding-top:0; border-top:none; justify-content:flex-start; }
.legal-footer span{ cursor:pointer; text-decoration:underline; }
.legal-page{ max-width:760px; margin:0 auto; }
.legal-page .card{ padding:28px; }
.legal-page h1{ margin-bottom:10px; }
.legal-page h2{ margin:18px 0 8px; font-size:16px; }
.legal-page p, .legal-page li{ color:var(--text-soft); line-height:1.7; font-size:14px; }
.legal-page ul{ padding-left:18px; }
.api-banner{ background:rgba(139,92,246,0.08); border:1px solid rgba(139,92,246,0.32); color:var(--offwhite); border-radius:10px; padding:12px 14px; font-size:12.5px; line-height:1.5; margin-bottom:20px; }

/* Responsive */
@media (max-width:780px){
  #app{ flex-direction:column; }
  #sidebar{ width:100%; flex-direction:row; align-items:center; padding:14px 16px; overflow-x:auto; gap:14px; }
  .brand{ margin-bottom:0; }
  .brand span{ display:none; }
  .nav{ flex-direction:row; }
  .nav-link span{ display:none; }
  .nav-link{ padding:10px; }
  .member-card{ margin-top:0; margin-left:auto; }
  .member-card > div:last-child{ display:none; }
  .trust-line, .guest-pill{ display:none; }
  #content{ padding:26px 18px 70px; }
  .page-title{ font-size:26px; }
}
@media (max-width:420px){
  .member-type-grid{ grid-template-columns:1fr; }
  .btn, .auth-tab{ font-size:12.8px; }
}
</style>
</head>
<body>
<div id="app"><div id="boot-loading">Loading Kollektiv…</div></div>
<script>
(function(){
'use strict';

/* ============ CONFIG ============ */
// Relative path: works automatically when this file is served by the
// Kollektiv API itself (npm start -> http://localhost:PORT/). If you're
// viewing this file standalone against a backend running elsewhere, change
// this to that backend's full URL, e.g. 'http://localhost:3000/api'.
var API_BASE = '/api';

/* Storage abstraction: prefer `window.storage` when available (Electron/webview),
   otherwise fall back to `localStorage` so the frontend still persists tokens in
   a regular browser environment. */
var storage = (function(){
  if(typeof window.storage !== 'undefined' && typeof window.storage.get === 'function'){
    return window.storage;
  }
  return {
    get: async function(key){
      var v = localStorage.getItem(key);
      return v === null ? null : { value: v };
    },
    set: async function(key, value){
      if(value === undefined || value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
      return true;
    },
    delete: async function(key){ localStorage.removeItem(key); return true; }
  };
})();

/* ============ ICONS ============ */
var LOGO_SVG = '<svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24 L13 16"/><path d="M16 26 L16 17"/><path d="M26 24 L19 16"/><circle cx="16" cy="10" r="6"/></svg>';

/* ============ HELPERS ============ */
function esc(str){
  var d = document.createElement('div');
  d.textContent = (str===null||str===undefined) ? '' : String(str);
  return d.innerHTML;
}
function initialsOf(name){
  if(!name) return '?';
  var parts = name.trim().split(/\s+/).slice(0,2);
  return parts.map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
}
function memberTypeLabel(id){
  for(var i=0;i<MEMBER_TYPES.length;i++){ if(MEMBER_TYPES[i].id===id) return MEMBER_TYPES[i].label; }
  return 'Member';
}
function timeAgo(iso){
  if(!iso) return '';
  var then = new Date(iso.replace(' ', 'T') + 'Z').getTime();
  var diffMs = Date.now() - then;
  var mins = Math.round(diffMs / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + (mins===1?' minute ago':' minutes ago');
  var hours = Math.round(mins/60);
  if(hours < 24) return hours + (hours===1?' hour ago':' hours ago');
  var days = Math.round(hours/24);
  return days + (days===1?' day ago':' days ago');
}

/* ============ API CLIENT ============ */
var ApiError = function(message, status, details){
  this.message = message; this.status = status; this.details = details;
};
async function apiFetch(path, opts){
  opts = opts || {};
  var headers = {'Content-Type':'application/json'};
  if(opts.auth !== false && token) headers.Authorization = 'Bearer ' + token;
  var res;
  try{
    res = await fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
    });
  }catch(networkErr){
    apiUnreachable = true;
    throw new ApiError('Could not reach the Kollektiv API. Is the server running?', 0);
  }
  apiUnreachable = false;
  var json = null;
  try{ json = await res.json(); }catch(e){ /* e.g. 204 No Content */ }
  if(res.status === 401 && opts.auth !== false){
    await clearSession();
    renderAuthScreen('Your session has expired. Please log in again.');
  }
  if(!res.ok){
    var msg = (json && json.error && json.error.message) || ('Request failed (' + res.status + ')');
    throw new ApiError(msg, res.status, json && json.error && json.error.details);
  }
  return json;
}

/* ============ TOKEN PERSISTENCE (via window.storage, not localStorage) ============ */
async function saveToken(t){
  token = t;
  try{ await storage.set('kollektiv-token', t); }catch(e){ /* non-fatal: session won't survive a reload */ }
}
async function clearSession(){
  token = null; me = null; guestMode = false;
  try{ await storage.delete('kollektiv-token'); }catch(e){}
}
async function loadToken(){
  try{
    var res = await storage.get('kollektiv-token');
    return (res && res.value) ? res.value : null;
  }catch(e){ return null; }
}

/* Entry point for both the auth screen and the in-app sidebar links.
   Builds a #content target if one doesn't already exist (i.e. we're on
   the auth screen, which has no app shell), and remembers how to get
   back to wherever the user came from. */
function showLegal(kind){
  var contentEl = document.getElementById('content');
  if(contentEl){
    legalBackContext = { type:'view', view: lastView, params: lastParams };
  } else {
    legalBackContext = { type:'auth', mode: authMode };
    document.getElementById('app').innerHTML =
      '<div id="authscreen"><div class="auth-card" style="max-width:640px;"><div id="content" style="max-width:none;padding:0;"></div></div></div>';
  }
  renderLegalPage(kind);
}
function legalBack(){
  var ctx = legalBackContext;
  legalBackContext = null;
  if(!ctx){ goToAuth(); return; }
  if(ctx.type === 'view' && ctx.view){
    navigate(ctx.view, ctx.params || {});
  } else {
    authMode = (ctx.type === 'auth' && ctx.mode) ? ctx.mode : 'login';
    renderAuthScreen();
  }
}
function memberTypeOptionHtml(t){

    + '<div class="type-label">'+esc(t.label)+'</div><div class="type-need">\u201c'+esc(t.need)+'\u201d</div></div>';

function selectObType(type, el){
  obSelectedType = type;
  var opts = document.querySelectorAll('.type-option');
  for(var i=0;i<opts.length;i++) opts[i].classList.remove('selected');
  el.classList.add('selected');
}
function switchAuthTab(mode){
  authMode = mode;

async function submitAuth(){
  var email = document.getElementById('auth-email').value.trim();
  var password = document.getElementById('auth-password').value;
  var errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  try{
    if(authMode === 'signup'){
      var name = document.getElementById('auth-name').value.trim();
      var result = await apiFetch('/auth/signup', { method:'POST', auth:false,
        body:{ name: name, email: email, password: password, memberType: obSelectedType } });
      await saveToken(result.token);
    } else {
      var result2 = await apiFetch('/auth/login', { method:'POST', auth:false, body:{ email: email, password: password } });
      await saveToken(result2.token);
    }
    guestMode = false;
    await loadMeAndEnter();
  }catch(err){
    if(err.details && err.details.length){
      errEl.textContent = err.details.map(function(d){ return d.message; }).join(' ');
    } else {
      errEl.textContent = err.message;
    }
    renderAuthScreenPreservingInputs(errEl.textContent);
  }
}
function renderAuthScreenPreservingInputs(msg){
  // Re-render shows the banner/error but the user has to retype - acceptable
  // for this app's scope; a nicer version would preserve field values too.
  renderAuthScreen(msg);
}

async function submitThread(slug){
  var titleEl = document.getElementById('nt-title');
  var bodyEl = document.getElementById('nt-body');
  var fileInput = document.getElementById('nt-image-file');
  var errEl = document.getElementById('nt-error');
  
  try{
    var finalImageUrl = undefined;
    
    if (fileInput && fileInput.files.length > 0) {
      finalImageUrl = await new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) { resolve(e.target.result); };
        reader.onerror = function(e) { reject(new Error("File read error")); };
        reader.readAsDataURL(fileInput.files[0]);
      });
    }

    await apiFetch('/circles/'+slug+'/threads', {
      method:'POST',
      body:{ title: titleEl.value.trim(), body: bodyEl.value.trim(), imageUrl: finalImageUrl }
    });
    await renderCircleThreads(slug);
  }catch(err){
    errEl.textContent = err.details ? err.details.map(function(d){return d.message;}).join(' ') : err.message;

}

async function submitProject(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  var titleEl = document.getElementById('proj-title');
  var descEl = document.getElementById('proj-desc');
  var linkEl = document.getElementById('proj-link');
  var errEl = document.getElementById('proj-error');

  if (!titleEl || !descEl || !linkEl) {
    return;
  }

  var title = titleEl.value.trim();
  var description = descEl.value.trim();
  var link = linkEl.value.trim();

  if (!title) {
    errEl.textContent = 'Please enter a project title.';
    titleEl.focus();
    return;
  }

  if (!description) {
    errEl.textContent = 'Please describe your project.';
    descEl.focus();
    return;
  }

  errEl.textContent = '';

  try {
    await apiFetch('/users/me/projects', {
      method: 'POST',
      body: {
        title: title,
        description: description,
        link: link || undefined
      }
    });

    await renderProfile();

  } catch (err) {
    errEl.textContent =
      err.details
        ? err.details.map(function(d) {
            return d.message;
          }).join(' ')
        : (err.message || 'Unable to save project.');
  }
}

async function setCareerField(field, value){
  var isWorkPref = field === 'workPref';
  var rowEl = document.getElementById(isWorkPref ? 'workpref-chips' : 'availability-chips');
  var options = isWorkPref ? WORK_PREF_OPTIONS : AVAILABILITY_OPTIONS;
  var chipFn = isWorkPref ? workPrefChipHtml : availabilityChipHtml;
  var previousValue = me.careerGoals[field];
  if(previousValue === value) return;

  // Update immediately (no full-page reload/flash) and only this chip row.
  me.careerGoals[field] = value;
  if(rowEl) rowEl.innerHTML = options.map(chipFn).join('');

  try{
    var body = {};
    body[field] = value;
    await apiFetch('/users/me', { method:'PATCH', body: body });
  }catch(err){
    // Revert the optimistic update if the save didn't actually go through.
    me.careerGoals[field] = previousValue;
    if(rowEl) rowEl.innerHTML = options.map(chipFn).join('');
  }
}

/* ============ LOADING ============ */
function setLoading(){
  var content = document.getElementById('content');
  if(content) content.innerHTML = '<div class="empty-state">Loading\u2026</div>';

/* ============ NAVIGATION ============ */
async function navigate(view, params){
  params = params || {};
  lastView = view;
  lastParams = params;
  document.querySelectorAll('.nav-link').forEach(function(n){ n.classList.remove('active'); });
  var map = {fieldHome:'fieldHome', circles:'circles', circleThreads:'circles', thread:'circles', profile:'profile', opportunities:'opportunities'};
  var navKey = map[view] || view;
  var navEl = document.querySelector('.nav-link[data-view="'+navKey+'"]');
  if(navEl) navEl.classList.add('active');
  window.scrollTo(0,0);
  try{
    if(view==='fieldHome') await renderFieldHome();
    else if(view==='circles') await renderCirclesList();
    else if(view==='circleThreads') await renderCircleThreads(params.circle);
    else if(view==='thread') await renderThread(params.circle, params.thread);
    else if(view==='profile') await renderProfile();
    else if(view==='opportunities') await renderOpportunities();
  }catch(err){
    var content = document.getElementById('content');
    if(content){
      content.innerHTML = '<div class="api-banner">'+esc(err.message)+'</div>';
    }
  }
}

/* ============ ACCESSIBILITY ENHANCEMENT ============ */
function enhanceFocusability(){
  document.querySelectorAll('[data-action]').forEach(function(el){
    var tag = el.tagName;
    if(tag!=='BUTTON' && tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT' && tag!=='A'){
      if(!el.hasAttribute('tabindex')) el.tabIndex = 0;
      if(!el.hasAttribute('role')) el.setAttribute('role','button');
    }
  });
}

/* ============ EVENT DELEGATION ============ */
function flashSaved(inputEl){
  var tick = inputEl.nextElementSibling;
  if(!tick || !tick.classList || !tick.classList.contains('saved-tick')){
    tick = document.createElement('span');
    tick.className = 'saved-tick';
    inputEl.insertAdjacentElement('afterend', tick);
  }
  tick.textContent = 'Saved';
  tick.classList.add('show');
  clearTimeout(tick._t);
  tick._t = setTimeout(function(){ tick.classList.remove('show'); }, 1300);
}

function onClick(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  if(action==='select-type'){ selectObType(el.dataset.type, el); }
  else if(action==='auth-tab'){ switchAuthTab(el.dataset.mode); }
  else if(action==='submit-auth'){ submitAuth(); }
  else if(action==='browse-guest'){ browseAsGuest(); }
  else if(action==='go-to-auth'){ goToAuth(); }
  else if(action==='show-privacy-policy'){ showLegal('privacy'); }
  else if(action==='show-user-agreement'){ showLegal('agreement'); }
  else if(action==='legal-back'){ legalBack(); }
  else if(action==='ask-logout'){ askLogout(); }
  else if(action==='confirm-logout'){ logout(); }
  else if(action==='cancel-logout'){ renderProfile(); }
  else if(action==='nav'){ navigate(el.dataset.view, {circle: el.dataset.circle, thread: el.dataset.thread}); }
  else if(action==='lp-tab'){ lpTab = el.dataset.tab; renderFieldHome(); }
  else if(action==='toggle-acc'){ var idx=+el.dataset.idx; accOpen[idx] = !accOpen[idx]; renderFieldHome(); }
  else if(action==='show-new-thread'){ showNewThreadForm(el.dataset.circle); }
  else if(action==='cancel-new-thread'){ document.getElementById('new-thread-form').innerHTML=''; }
  else if(action==='submit-thread'){ submitThread(el.dataset.circle); }
  else if(action==='submit-reply'){ submitReply(el.dataset.thread); }
  else if(action==='mark-helpful'){ markHelpful(el.dataset.thread, el.dataset.reply); }
  else if(action==='toggle-thread-like'){ toggleThreadLike(el.dataset.thread); }
  else if(action==='toggle-reply-like'){ toggleReplyLike(el.dataset.thread, el.dataset.reply); }
  else if(action==='save-avatar'){ 
    var fileInput = document.getElementById('avatar-file-input');
    if (fileInput && fileInput.files.length > 0) {
      new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) { resolve(e.target.result); };
        reader.onerror = function(e) { reject(e); };
        reader.readAsDataURL(fileInput.files[0]);
      }).then(function(base64Image) {
        return apiFetch('/users/me', {method:'PATCH', body:{avatarUrl: base64Image}});
      }).then(function(){ 
        return renderProfile(); 
      });
    } else {
      // Allows users to clear their avatar by saving an empty input
      apiFetch('/users/me', {method:'PATCH', body:{avatarUrl: ''}}).then(function(){ return renderProfile(); });
    }
  }
  else if(action==='show-project-form'){ showProjectForm(); }
  else if(action==='cancel-project-form'){ document.getElementById('project-form-slot').innerHTML=''; }
  else if(action==='submit-project'){ submitProject(); }
  else if(action==='remove-project'){ removeProject(el.dataset.id); }
  else if(action==='add-learning'){ addSkill('learning','add-learning'); }
  else if(action==='add-can'){ addSkill('can_demonstrate','add-can'); }
  else if(action==='remove-skill'){ removeSkill(el.dataset.id); }
  else if(action==='set-workpref'){ setCareerField('workPref', el.dataset.value); }
  else if(action==='set-availability'){ setCareerField('availability', el.dataset.value); }
  else if(action==='toggle-milestone'){ toggleMilestone(el.dataset.id); }
  else if(action==='edit-name'){ showNameEdit(); }
  else if(action==='save-name'){ saveNameEdit(); }
  else if(action==='toggle-interest'){ toggleInterest(el.dataset.id); }
  else if(action==='filter-opp'){ oppFilter = el.dataset.filter; renderOpportunities(); }
}
function onFocusOut(e){
  var el = e.target.closest('[data-blur-action]');
  if(!el) return;
  var action = el.dataset.blurAction;
  if(action==='save-goal'){ apiFetch('/users/me', {method:'PATCH', body:{goal: el.value.trim()}}).then(function(){ me.goal = el.value.trim(); flashSaved(el); }); }
  else if(action==='save-target-role'){ apiFetch('/users/me', {method:'PATCH', body:{targetRole: el.value.trim()}}).then(function(){ me.careerGoals.targetRole = el.value.trim(); flashSaved(el); }); }
}
function onKeydown(e){
  if(e.key==='Enter'){
    var enterEl = e.target.closest('[data-enter-action]');
    if(enterEl){
      var action = enterEl.dataset.enterAction;
      if(action==='add-learning') addSkill('learning','add-learning');
      else if(action==='add-can') addSkill('can_demonstrate','add-can');
      return;
    }
  }
  if(e.key==='Enter' || e.key===' '){
    var el = e.target.closest('[data-action]');
    if(el && ['INPUT','TEXTAREA','BUTTON','SELECT'].indexOf(el.tagName)===-1){
      e.preventDefault();
      el.click();
    }
  }
}

document.body.addEventListener('click', onClick);
document.body.addEventListener('focusout', onFocusOut);
document.body.addEventListener('keydown', onKeydown);

var focusObserver = new MutationObserver(function(){ enhanceFocusability(); });
focusObserver.observe(document.getElementById('app'), {childList:true, subtree:true});

/* ============ INIT ============ */
async function waitForStorage(maxWaitMs){
  var waited = 0;
  while(typeof window.storage === 'undefined' && waited < maxWaitMs){
    await new Promise(function(r){ setTimeout(r, 50); });
    waited += 50;
  }
}
async function init(){
  await waitForStorage(1000);
  var savedToken = await loadToken();
  if(savedToken){
    token = savedToken;
    try{
      me = await apiFetch('/users/me');
      await enterApp();
      return;
    }catch(e){
      // token invalid/expired, or API unreachable - fall through to auth screen
    }
  }
  renderAuthScreen();
}
init();

})();
</script>
