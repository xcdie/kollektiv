<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollektiv</title>
<style>
:root{
  --ink:#ffffff;
  --primary:#5174c6;
  --primary-dark:rgb(85, 95, 209);
  --primary-soft:#5174c6;
  --bg:#090b11;
  --bg-alt:#101218;
  --panel:#141821;
  --panel-strong:#1a1d29;
  --line:rgba(255,255,255,0.08);
  --text-soft:#b8bdd0;
  --text-softer:#8d92a8;
  --offwhite:#f3f4f8;
  --red:#ff7d6f;
  --evergreen:#5174c6;
  --evergreen-light:#5174c6;
  --chartreuse:#c4b5fd;
  --mint:#5174c6;
  --paper:#0f1720;
  --radius:18px;
  --shadow:0 18px 48px rgba(1, 2, 6, 0.5);
  --shadow-soft:0 16px 32px rgba(0,0,0,0.28);
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
body[data-theme="light"]{
  --ink:#111827;
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --primary-soft:#2563eb;
  --bg:#edf2f7;
  --bg-alt:#f7fafc;
  --panel:#ffffff;
  --panel-strong:#f3f4f6;
  --line:#dfe7f1;
  --text-soft:#475569;
  --text-softer:#64748b;
  --offwhite:#0f172a;
  --red:#dc2626;
  --evergreen:#2563eb;
  --evergreen-light:#1d4ed8;
  --chartreuse:#dbeafe;
  --mint:#e0f2fe;
  --paper:#f8fafc;
  --shadow:0 18px 48px rgba(15, 23, 42, 0.12);
  --shadow-soft:0 16px 32px rgba(15, 23, 42, 0.10);
}
body[data-theme="dark"]{
  --ink:#ffffff;
  --primary:#5174c6;
  --primary-dark:rgb(85, 95, 209);
  --primary-soft:#5174c6;
  --bg:#090b11;
  --bg-alt:#101218;
  --panel:#141821;
  --panel-strong:#1a1d29;
  --line:rgba(255,255,255,0.08);
  --text-soft:#b8bdd0;
  --text-softer:#8d92a8;
  --offwhite:#f3f4f8;
  --red:#ff7d6f;
  --evergreen:#5174c6;
  --evergreen-light:#5174c6;
  --chartreuse:#c4b5fd;
  --mint:#5174c6;
  --paper:#0f1720;
  --shadow:0 18px 48px rgba(1, 2, 6, 0.5);
  --shadow-soft:0 16px 32px rgba(0,0,0,0.28);
}

*{ box-sizing:border-box; }
html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

body {
    background: var(--bg);
    font-family: var(--sans);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

#app, #sidebar, #main, #content { min-width: 0; }

button, input, textarea, [data-action]{ transition:all 0.2s ease; }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important; } }
#boot-loading{ min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--text-soft); font-size:14px; width:100%; }

/* Layout */
#app{ display:flex; min-height:100vh; width:100%; }
#sidebar{ width:220px; flex-shrink:0; background:var(--bg-alt); color:var(--offwhite); display:flex; flex-direction:column; padding:18px 12px 14px; box-shadow: inset -1px 0 0 rgba(255,255,255,0.04); }
#main{ flex:1; min-width:0; position:relative; }
#content{ width:min(100%, 1080px); margin:0 auto; padding:22px 18px 60px; }

/* Focus */
[data-action]:focus-visible{ outline:2px solid var(--evergreen); outline-offset:2px; border-radius:8px; }
#sidebar [data-action]:focus-visible{ outline-color:var(--chartreuse); }
input:focus-visible, textarea:focus-visible{ outline:none; border-color:var(--evergreen); box-shadow:0 0 0 3px rgba(139,92,246,0.18); }
input:focus, textarea:focus{ outline:none; border-color:var(--evergreen); }

/* Brand & Nav */
.brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; color:inherit; }
.brand-mark{
  width:30px; height:30px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  border-radius:10px; background:linear-gradient(155deg, var(--primary), var(--primary-dark));
  color:var(--offwhite); box-shadow:0 8px 20px rgba(81,116,198,0.35), inset 0 1px 0 rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.08);
}
.brand-mark svg{ width:18px; height:18px; display:block; }
.brand-text{ font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:0.02em; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav-link{ display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:12px; cursor:pointer; font-size:14.5px; font-weight:500; color:rgba(236,244,239,0.7); border-left:3px solid transparent; }
.nav-link:hover{ background:rgba(255,255,255,0.04); color:var(--offwhite); transform:translateX(1px); }
.nav-link.active{ background:rgba(139,92,246,0.12); color:var(--primary-soft); border-left-color:var(--primary); box-shadow:inset 0 0 0 1px rgba(139,92,246,0.15); }
.nav-link{ min-height:40px; }
.nav-link svg{ width:18px; height:18px; display:block; flex-shrink:0; }
.nav-link span{ display:inline-block; white-space:nowrap; vertical-align:middle; }
.member-card{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:rgba(255,255,255,0.02); margin-top:auto; cursor:pointer; border:1px solid rgba(255,255,255,0.06); box-shadow:0 8px 24px rgba(0,0,0,0.18); }
.member-card:hover{ background:rgba(255,255,255,0.07); transform:translateY(-1px); }
.avatar{ width:36px; height:36px; border-radius:50%; background:var(--primary); color:var(--offwhite); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--serif); flex-shrink:0; font-size:14px; box-shadow:0 8px 18px rgba(139,92,246,0.22); }
.avatar-lg{ width:56px; height:56px; font-size:19px; }
.trust-line{ font-size:11px; color:rgba(236,244,239,0.4); text-align:center; margin-top:14px; }
.guest-pill{ font-size:11.5px; color:rgba(236,244,239,0.55); text-align:center; margin-top:14px; line-height:1.5; }
.guest-pill span{ text-decoration:underline; cursor:pointer; color:var(--chartreuse); }
.legal-footer{ display:flex; flex-direction:column; gap:6px; margin-top:12px; font-size:11px; color:rgba(236,244,239,0.4); text-align:center; }
.legal-footer span{ cursor:pointer; text-decoration:underline; }
.legal-footer span:hover{ color:var(--offwhite); }
.theme-switch{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:18px 0 10px; padding:8px 10px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,0.04); color:var(--ink); cursor:pointer; }
.theme-switch:hover{ background:rgba(255,255,255,0.06); }
.theme-switch-label{ font-size:11.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-soft); }
.theme-switch-pill{ position:relative; width:42px; height:24px; border-radius:999px; background:var(--panel-strong); border:1px solid var(--line); }
.theme-switch-pill::after{ content:''; position:absolute; top:3px; left:4px; width:16px; height:16px; border-radius:50%; background:var(--primary); box-shadow:0 2px 8px rgba(0,0,0,0.20); transition:transform .2s ease; }
body[data-theme="light"] .theme-switch-pill::after{ transform:translateX(18px); }

/* Typography */
.page-title{ font-family:var(--serif); font-size:30px; font-weight:600; margin:0 0 8px; line-height:1.15; }
.page-sub{ color:var(--text-soft); font-size:15px; margin:0 0 22px; max-width:620px; line-height:1.55; }
.section-title{ font-family:var(--serif); font-size:20px; font-weight:600; margin:0 0 10px; }
.section{ margin-bottom:26px; }

/* Cards */
.card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-soft); }
.card:hover{ box-shadow:0 18px 36px rgba(0,0,0,0.22); transform:translateY(-1px); }
.hr{ height:1px; background:linear-gradient(90deg, var(--line), rgba(139,92,246,0.08)); margin:12px 0; }

/* Buttons */
.btn{ display:inline-flex; align-items:center; gap:6px; border:none; border-radius:24px; padding:10px 24px; font-family:var(--sans); font-weight:700; font-size:14px; cursor:pointer; box-shadow:none; }
.btn-primary{ background:#0066cc; color:#fff; }
.btn-primary:hover{ background:#0052a3; transform:none; box-shadow:none; }
.btn-primary:disabled{ opacity:0.55; cursor:default; transform:none; }
.btn-secondary{ background:#f0f0f0; border:1px solid #ccc; color:#030303; }
.btn-secondary:hover{ background:#e0e0e0; transform:none; }
.btn-ghost{ background:transparent; color:var(--evergreen-light); padding:8px 4px; text-decoration:underline; }
.btn-block{ width:100%; justify-content:center; }

/* Chips */
.chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:100px; background:var(--mint); color:var(--ink); font-size:12.5px; font-weight:500; }
.chip-guide{ background:var(--chartreuse); color:var(--ink); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; padding:3px 8px; border-radius:100px; display:inline-flex; align-items:center; gap:3px; }
.chip-helpful{ background:var(--chartreuse); font-weight:700; display:inline-flex; align-items:center; gap:4px; }
.chip-can{ background:var(--chartreuse); }
.chip-removable{ padding-right:6px; }
.chip-x{ cursor:pointer; opacity:0.55; font-weight:700; margin-left:2px; }
.chip-x:hover{ opacity:1; }
.chip-select{ cursor:pointer; background:var(--offwhite); border:1.5px solid var(--line); color:var(--panel-strong); }
.chip-select.chip-selected{ background:var(--evergreen); color:var(--offwhite); border-color:var(--evergreen); }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
.seal{ width:12px; height:12px; flex-shrink:0; }
.mark-helpful{ font-size:11.5px; color:var(--evergreen); text-decoration:underline; cursor:pointer; font-weight:600; }
.like-btn{ display:inline-flex; align-items:center; padding:3px 6px; margin:-3px -6px; border-radius:6px; }
.like-btn:hover{ background:rgba(255,255,255,0.06); }

/* Tabs */
.tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.tab{ padding:9px 14px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--text-soft); border-bottom:2px solid transparent; margin-bottom:-1px; border-radius:10px 10px 0 0; }
.tab:hover{ background:rgba(139,92,246,0.05); }
.tab.active{ color:var(--evergreen-light); border-bottom-color:var(--chartreuse); background:rgba(139,92,246,0.08); }

/* Accordion */
.acc-item{ border-bottom:1px solid var(--line); padding:13px 0; cursor:pointer; }
.acc-item:last-child{ border-bottom:none; }
.acc-item:hover .acc-head{ color:var(--evergreen-light); }
.acc-head{ display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:14.5px; }
.acc-body{ color:var(--text-soft); font-size:13.5px; margin-top:8px; line-height:1.55; }

/* Theme banner */
.theme-banner{ background:var(--panel-strong); color:var(--offwhite); border-radius:var(--radius); padding:26px; box-shadow:0 18px 34px rgba(0,0,0,0.25); border:1px solid rgba(139,92,246,0.18); }
.theme-banner .section-title{ color:var(--offwhite); margin-top:6px; }
.theme-tag{ display:inline-block; background:var(--primary); color:var(--offwhite); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:4px 10px; border-radius:100px; }
.theme-steps{ display:flex; flex-direction:column; gap:7px; font-size:14px; margin-top:12px; color:rgba(236,244,239,0.9); }
.theme-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.theme-banner .btn-secondary{ border-color:rgba(255,255,255,0.22); color:var(--offwhite); }
.theme-banner .btn-secondary:hover{ background:rgba(255,255,255,0.06); }

/* Digest */
.digest-text{ font-family:var(--serif); font-size:16.5px; font-weight:500; line-height:1.5; color:var(--ink); }
.digest-by{ font-size:12px; color:var(--text-softer); margin-top:5px; }


.role-row{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
.role-row:last-child{ border-bottom:none; }
.role-title{ font-weight:600; font-size:14.5px; }
.role-note{ font-size:13px; color:var(--text-soft); margin-top:3px; }
.role-range{ font-family:var(--serif); font-weight:600; color:var(--evergreen); white-space:nowrap; font-size:15px; }
.ranges-note{ font-size:12px; color:var(--text-softer); margin-top:8px; }

/* Guides */
.guide-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
.guide-top{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.guide-name{ font-weight:600; font-size:14.5px; }
.guide-role{ font-size:12.5px; color:var(--text-soft); margin-top:2px; }
.guide-focus{ font-size:13px; margin-top:8px; line-height:1.45; }

/* Circles */
.circle-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
.circle-card{ cursor:pointer; }
.circle-card:hover{ transform:translateY(-2px); }
.circle-desc{ font-size:13.5px; color:var(--text-soft); margin-bottom:14px; line-height:1.45; }
.circle-count{ font-size:12px; color:var(--text-softer); }
.crumb{ font-size:13px; color:var(--evergreen); cursor:pointer; margin-bottom:16px; font-weight:600; display:inline-block; }
.thread-row{ padding:16px 20px; border-bottom:1px solid var(--line); cursor:pointer; }
.thread-row:last-child{ border-bottom:none; }
.thread-title{ font-weight:600; font-size:14.5px; margin-bottom:5px; }
.thread-meta{ font-size:12px; color:var(--text-softer); display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
.dot{ color:var(--text-softer); }
.empty-state{ padding:34px; text-align:center; color:var(--text-softer); font-size:14px; }
.share-note{ font-size:12px; color:var(--text-softer); margin-top:10px; }
.signin-prompt{ padding:14px 20px; background:var(--mint); border-radius:10px; font-size:13.5px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.signin-prompt span[data-action]{ font-weight:700; text-decoration:underline; cursor:pointer; }

/* Thread detail */
.reply{ padding:15px 0; border-bottom:1px solid var(--line); }
.reply:last-child{ border-bottom:none; }
.reply-author{ font-weight:600; color:var(--ink); }
.reply-body{ margin-top:6px; font-size:14px; line-height:1.55; }

/* Forms */
label{ font-size:12px; font-weight:500; color:var(--ink); margin-bottom:8px; display:block; text-transform:capitalize; letter-spacing:0; }
input[ type=text], input[type=email], input[type=password], textarea, input[type=file], select{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px; font-family:var(--sans); font-size:14px; background:var(--panel); color:var(--ink); box-shadow:none; }
input[type=text]:hover, input[type=email]:hover, input[type=password]:hover, textarea:hover, input[type=file]:hover, select:hover{ border-color:var(--text-softer); }
input[type=text]:focus, input[type=email]:focus, input[type=password]:focus, textarea:focus, input[type=file]:focus, select:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 2px rgba(81,116,198,0.15); }
textarea{ resize:vertical; min-height:72px; }
input[type=file]{ cursor:pointer; padding:8px 10px; color:var(--text-soft); font-size:13px; }
input[type=file]::file-selector-button,
input[type=file]::-webkit-file-upload-button{
  -webkit-appearance:none;
  appearance:none;
  border:1.5px solid rgba(139,92,246,0.28);
  background:rgba(139,92,246,0.1);
  color:var(--primary-soft);
  font-family:var(--sans);
  font-weight:700;
  font-size:12.5px;
  border-radius:9px;
  padding:8px 14px;
  margin-right:12px;
  cursor:pointer;
  transition:all 0.2s ease;
}
input[type=file]::file-selector-button:hover,
input[type=file]::-webkit-file-upload-button:hover{
  background:rgba(139,92,246,0.2);
  border-color:rgba(139,92,246,0.45);
}
input[type=file]:focus-visible::file-selector-button{ outline:2px solid var(--evergreen); outline-offset:2px; }
.saved-tick{ font-size:11px; color:#008000; font-weight:600; opacity:0; transition:opacity .3s; display:block; margin-top:4px; }
.saved-tick.show{ opacity:1; }
.field{ margin-bottom:14px; }
.field:last-child{ margin-bottom:0; }
.form-error{ font-size:13px; color:#d32f2f; margin-top:8px; line-height:1.5; }
.form-error:empty{ display:none; }

/* Profile */
.profile-avatar{ width:72px; height:72px; border-radius:50%; background:var(--primary); color:var(--offwhite); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--serif); flex-shrink:0; font-size:22px; box-shadow:0 12px 28px rgba(139,92,246,0.28); }
.profile-header{ display:flex; align-items:center; gap:16px; margin-bottom:10px; }
.profile-name{ display:flex; align-items:center; gap:10px; }
.edit-link{ font-size:12.5px; font-weight:500; color:var(--evergreen); cursor:pointer; text-decoration:underline; }
.work-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
.goal-field{ margin-bottom:8px; max-width:440px; }
.career-card{ display:flex; flex-direction:column; gap:16px; }
.proj-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:14px; }
.proj-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.proj-title{ font-weight:600; font-size:14.5px; }
.proj-desc{ font-size:13.5px; color:var(--text-soft); margin-top:6px; line-height:1.5; }
.proj-link{ font-size:12.5px; margin-top:8px; color:var(--evergreen); word-break:break-all; }
.contrib-row{ padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; }
.contrib-row:last-child{ border-bottom:none; }
.recog-text{ font-family:var(--serif); font-style:italic; font-size:15px; line-height:1.5; }
.recog-from{ font-size:12px; font-style:normal; font-family:var(--sans); color:var(--text-softer); margin-top:4px; }
.milestone-row{ display:flex; align-items:center; gap:10px; padding:8px 0; cursor:pointer; font-size:14px; }
.milestone-row input{ width:16px; height:16px; accent-color:var(--evergreen); cursor:pointer; }
.milestone-done{ text-decoration:line-through; color:var(--text-softer); }
.danger-zone{ text-align:center; font-size:12.5px; color:var(--text-softer); margin-top:44px; }
.danger-zone [data-action]{ text-decoration:underline; cursor:pointer; }
.danger-zone [data-action="confirm-logout"]{ color:var(--red); font-weight:600; }

/* Opportunities */
.opp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
.opp-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.opp-title{ font-weight:600; font-size:14.5px; }
.opp-company{ font-size:13px; color:var(--text-soft); margin-top:2px; }
.opp-loc{ font-size:12.5px; color:var(--text-softer); margin-top:10px; }
.pay{ font-family:var(--serif); font-weight:600; color:var(--evergreen); margin-top:6px; font-size:16px; }
.opp-blurb{ font-size:13.5px; margin-top:8px; line-height:1.5; }
.verified-badge{ font-size:11.5px; color:var(--evergreen-light); font-weight:600; margin-top:12px; display:flex; align-items:center; gap:5px; }

/* Auth screen (Reddit-style) */
#authscreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  width:100%;
  background-image:
    linear-gradient(180deg, rgba(9,11,17,0.72), rgba(40, 47, 69, 0.8)),
    url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
.auth-card{ background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:16px; padding:32px 28px 24px; max-width:400px; width:100%; box-shadow:var(--shadow-soft); }
.auth-card label{ color:var(--ink); }
.auth-logo{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.auth-logo .brand-text{ color:var(--ink); }
.auth-title{ font-family:var(--sans); font-size:24px; font-weight:700; color:var(--ink); margin:0 0 8px; }
.auth-sub{ color:var(--text-soft); font-size:12.5px; line-height:1.5; margin:0 0 20px; }
.auth-sub span{ color:var(--primary); cursor:pointer; text-decoration:underline; }
.auth-btn{ width:100%; display:flex; align-items:center; justify-content:center; gap:10px; border-radius:999px; padding:12px 16px; font-family:var(--sans); font-size:14px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--ink); }
.auth-btn:hover{ background:var(--bg-alt); }
.auth-btn svg{ width:18px; height:18px; flex-shrink:0; }
.auth-btn-primary{ background:var(--primary); border-color:var(--primary); color:var(--offwhite); margin-top:6px; }

function timeAgo(iso){
  if(!iso) return '';
  var then = new Date(iso.replace(' ', 'T') + 'Z').getTime();
  var diffMs = Date.now() - then;
  var mins = Math.round(diffMs / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + (mins===1?' minute ago':' minutes ago');
  var hours = Math.round(mins/60);
  if(hours < 24) return hours + (hours===1?' hour ago':' hours ago');
  var days = Math.round(hours/24);
  return days + (days===1?' day ago':' days ago');
}

/* ============ API CLIENT ============ */
var ApiError = function(message, status, details){
  this.message = message; this.status = status; this.details = details;
};
async function apiFetch(path, opts){
  opts = opts || {};
  var headers = {'Content-Type':'application/json'};
  if(opts.auth !== false && token) headers.Authorization = 'Bearer ' + token;
  var res;
  try{
    res = await fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
    });
  }catch(networkErr){
    apiUnreachable = true;
    throw new ApiError('Could not reach the Kollektiv API. Is the server running?', 0);
  }
  apiUnreachable = false;
  var json = null;
  try{ json = await res.json(); }catch(e){ /* e.g. 204 No Content */ }
  if(res.status === 401 && opts.auth !== false){
    await clearSession();
    renderAuthScreen('Your session has expired. Please log in again.');
  }
  if(!res.ok){
    var msg = (json && json.error && json.error.message) || ('Request failed (' + res.status + ')');
    throw new ApiError(msg, res.status, json && json.error && json.error.details);
  }
  return json;
}

function updateThemeToggleLabel(){
  document.querySelectorAll('.theme-switch-label').forEach(function(label){
    label.textContent = document.body.getAttribute('data-theme') === 'light' ? 'Light mode' : 'Dark mode';
  });
}

function getSystemTheme(){
  if (typeof window !== 'undefined' && window.matchMedia) {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  return 'dark';
}

function applyTheme(theme, shouldPersist){
  var selected = (theme === 'light' || theme === 'dark') ? theme : getSystemTheme();
  document.body.setAttribute('data-theme', selected);
  document.documentElement.style.colorScheme = selected;
  updateThemeToggleLabel();
  if (shouldPersist !== false) {
    try{ localStorage.setItem('kollektiv-theme', selected); }catch(e){}
  }
}

function toggleTheme(){
  var current = document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark', true);
}

if (typeof document !== 'undefined') {
  try {
    var savedTheme = localStorage.getItem('kollektiv-theme');
    var hasSavedTheme = savedTheme === 'light' || savedTheme === 'dark';
    var initialTheme = hasSavedTheme ? savedTheme : getSystemTheme();
    applyTheme(initialTheme, hasSavedTheme);

    if (window.matchMedia) {
      var themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
      var syncSystemTheme = function(){
        try {
          var currentSavedTheme = localStorage.getItem('kollektiv-theme');
          if (currentSavedTheme === 'light' || currentSavedTheme === 'dark') {
            return;
          }
        } catch (e) {}
        applyTheme(getSystemTheme(), false);
      };
      if (themeMedia.addEventListener) {
        themeMedia.addEventListener('change', syncSystemTheme);
      } else if (themeMedia.addListener) {
        themeMedia.addListener(syncSystemTheme);
      }
    }
  } catch (e) {
    applyTheme('dark', false);
  }
}

async function submitAuth(){

  var errEl = document.getElementById('auth-error');
  var btnEl = document.querySelector('[data-action="submit-auth"]');

  if(btnEl){
    btnEl.disabled = true;

  }

  try{

        body:{ name: name, email: email, password: password, memberType: obSelectedType } });

    }

      errEl.textContent = err.details.map(function(d){ return d.message; }).join(' ');

  }
}
function renderAuthScreenPreservingInputs(msg){
  var snap = {};
  ['auth-name','auth-email'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) snap[id] = el.value;
  });
  renderAuthScreen(msg);
  Object.keys(snap).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.value = snap[id];
  });
}

/* ---- Google Sign-In (Google Identity Services) ----
   Google returns a signed ID token (credential). The server MUST verify it
   at POST /api/auth/google; never trust a name/email sent by the client. */
var gsiPromise = null;
function loadGsi(){
  if(window.google && google.accounts && google.accounts.id) return Promise.resolve();
  if(gsiPromise) return gsiPromise;
  gsiPromise = new Promise(function(resolve, reject){
    var sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client';
    sc.async = true; sc.defer = true;
    sc.onload = resolve;
    sc.onerror = function(){ gsiPromise = null; reject(new Error('Could not load Google Sign-In.')); };
    document.head.appendChild(sc);
  });
  return gsiPromise;
}
async function initGoogleButton(){
  var slot = document.getElementById('google-btn');
  if(!slot) return;
  if(!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.indexOf('YOUR_') === 0){
    slot.innerHTML = '<div class="form-error">Google sign-in isn\u2019t configured yet.</div>';
    return;
  }
  try{ await loadGsi(); }
  catch(e){ slot.innerHTML = '<div class="form-error">'+esc(e.message)+'</div>'; return; }
  if(!document.getElementById('google-btn')) return; // screen changed while loading

  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential,
    ux_mode: 'popup'
  });
  google.accounts.id.renderButton(slot, {
    type: 'standard', theme: 'outline', size: 'large', shape: 'pill',
    text: authMode === 'signup' ? 'signup_with' : 'signin_with',
    width: Math.min(slot.clientWidth || 320, 400)
  });
}
async function handleGoogleCredential(resp){
  var errEl = document.getElementById('auth-error');
  if(!resp || !resp.credential){
    if(errEl) errEl.textContent = 'Google sign-in was cancelled or failed.';
    return;
  }
  try{
    if(errEl) errEl.textContent = '';
    var result = await apiFetch('/auth/google', {
      method: 'POST', auth: false,
      body: { credential: resp.credential, memberType: obSelectedType }
    });
    await saveToken(result.token);
    guestMode = false;
    await loadMeAndEnter();
  }catch(err){
    if(errEl) errEl.textContent = err.message || 'Google sign-in failed.';
  }
}

async function submitThread(slug){
  var titleEl = document.getElementById('nt-title');
  var bodyEl = document.getElementById('nt-body');
  var fileInput = document.getElementById('nt-image-file');
  var errEl = document.getElementById('nt-error');

  try{
    var finalImageUrl = undefined;

    if (fileInput && fileInput.files.length > 0) {
      finalImageUrl = await new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) { resolve(e.target.result); };
        reader.onerror = function(e) { reject(new Error("File read error")); };
        reader.readAsDataURL(fileInput.files[0]);
      });
    }

    await apiFetch('/circles/'+slug+'/threads', {
      method:'POST',
      body:{ title: titleEl.value.trim(), body: bodyEl.value.trim(), imageUrl: finalImageUrl }
    });
    await renderCircleThreads(slug);
  }catch(err){
    errEl.textContent = err.details ? err.details.map(function(d){return d.message;}).join(' ') : err.message;
  }
}

function applyLikeVisual(el, liked, count){
  el.dataset.liked = liked ? '1' : '0';
  el.style.color = liked ? 'var(--primary)' : 'var(--text-softer)';
  el.textContent = (liked ? '\u2665' : '\u2661') + ' ' + count;
}
async function runLikeToggle(el, path){
  if(el.dataset.busy === '1') return;
  el.dataset.busy = '1';

  var wasLiked = el.dataset.liked === '1';
  var match = el.textContent.match(/\d+/);
  var prevCount = match ? parseInt(match[0], 10) : 0;
  applyLikeVisual(el, !wasLiked, wasLiked ? Math.max(0, prevCount - 1) : prevCount + 1);

  try{
    var result = await apiFetch(path, { method:'POST' });
    if(result && typeof result.liked === 'boolean' && typeof result.likeCount === 'number'){
      applyLikeVisual(el, result.liked, result.likeCount);
    }
  }catch(err){
    console.error('Like request failed:', err);
    applyLikeVisual(el, wasLiked, prevCount);
    notifyError(err.message || 'Could not update that like.');
  }finally{
    el.dataset.busy = '0';
  }
}
function toggleThreadLike(threadId, el){
  return runLikeToggle(el, '/threads/'+threadId+'/like');
}
function toggleReplyLike(threadId, replyId, el){

async function submitProject(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  var titleEl = document.getElementById('proj-title');
  var descEl = document.getElementById('proj-desc');
  var linkEl = document.getElementById('proj-link');
  var errEl = document.getElementById('proj-error');

  if (!titleEl || !descEl || !linkEl) {
    return;
  }

  var title = titleEl.value.trim();
  var description = descEl.value.trim();
  var link = linkEl.value.trim();

  if (!title) {
    errEl.textContent = 'Please enter a project title.';
    titleEl.focus();
    return;
  }

  if (!description) {
    errEl.textContent = 'Please describe your project.';
    descEl.focus();
    return;
  }

  errEl.textContent = '';

  try {
    var newProject = await apiFetch('/users/me/projects', {
      method: 'POST',
      body: {
        title: title,
        description: description,
        link: link || undefined
      }
    });

    if (!me.projects) me.projects = [];
    me.projects.unshift(newProject);
    renderProjects();

    var formSlot = document.getElementById('project-form-slot');
    if (formSlot) formSlot.innerHTML = '';

  } catch (err) {
    errEl.textContent =
      err.details
        ? err.details.map(function(d) {
            return d.message;
          }).join(' ')
        : (err.message || 'Unable to save project.');
  }
}

async function addSkill(status, inputId, event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  var input = document.getElementById(inputId);

  if (!input) {
    return;
  }

  var val = input.value.trim();

  if (!val) {
    input.focus();
    return;
  }

  try {
    var newSkill = await apiFetch('/users/me/skills', {
      method: 'POST',
      body: {
        name: val,
        status: status
      }
    });

    if (!me.skills) me.skills = [];
    me.skills.push(newSkill);
    input.value = '';
    renderSkillChips();
    input.focus();

  } catch (err) {
    console.error('Add skill error:', err);

    alert(
      err.details
        ? err.details.map(function(d) {
            return d.message;
          }).join(' ')
        : (err.message || 'Unable to add skill.')
    );
  }
}

async function setCareerField(field, value){
  var isWorkPref = field === 'workPref';

  var chipFn = isWorkPref ? workPrefChipHtml : availabilityChipHtml;
  var previousValue = me.careerGoals[field];
  if(previousValue === value) return;

  me.careerGoals[field] = value;
  if(rowEl) rowEl.innerHTML = options.map(chipFn).join('');

  try{
    var body = {};
    body[field] = value;
    await apiFetch('/users/me', { method:'PATCH', body: body });
  }catch(err){
    me.careerGoals[field] = previousValue;
    if(rowEl) rowEl.innerHTML = options.map(chipFn).join('');

async function navigate(view, params){
  params = params || {};
  lastView = view;
  lastParams = params;
  document.querySelectorAll('.nav-link').forEach(function(n){ n.classList.remove('active'); });
  var map = {fieldHome:'fieldHome', circles:'circles', circleThreads:'circles', thread:'circles', profile:'profile', opportunities:'opportunities', messages:'messages', notifications:'notifications', settings:'settings'};
  var navKey = map[view] || view;
  var navEl = document.querySelector('.nav-link[data-view="'+navKey+'"]');
  if(navEl) navEl.classList.add('active');
  window.scrollTo(0,0);
  try{
    if(view==='fieldHome') await renderFieldHome();
    else if(view==='circles') await renderCirclesList();
    else if(view==='circleThreads') await renderCircleThreads(params.circle);
    else if(view==='thread') await renderThread(params.circle, params.thread);
    else if(view==='profile') await renderProfile();
    else if(view==='opportunities') await renderOpportunities();
    else if(view==='messages') await renderMessages(params.userId || '');
    else if(view==='notifications') await renderNotifications();
    else if(view==='settings') await renderSettings();
    else if(view==='search') await renderSearchResults(params.q || '');
  }catch(err){
    var content = document.getElementById('content');
    if(content){
      content.innerHTML = '<div class="api-banner">'+esc(err.message)+'</div>';
    }
  }
}

/* ============ ACCESSIBILITY ENHANCEMENT ============ */
function enhanceFocusability(){
  document.querySelectorAll('[data-action]').forEach(function(el){
    var tag = el.tagName;
    if(tag!=='BUTTON' && tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT' && tag!=='A'){
      if(!el.hasAttribute('tabindex')) el.tabIndex = 0;
      if(!el.hasAttribute('role')) el.setAttribute('role','button');
    }
  });
}

/* ============ EVENT DELEGATION ============ */
function notifyError(msg){
  var content = document.getElementById('content');
  if(!content){ alert(msg); return; }
  var existing = content.querySelector('.api-banner');
  if(existing) existing.remove();
  var banner = document.createElement('div');
  banner.className = 'api-banner';
  banner.textContent = msg;
  content.insertBefore(banner, content.firstChild);
}
function flashSaved(inputEl){
  var tick = inputEl.nextElementSibling;
  if(!tick || !tick.classList || !tick.classList.contains('saved-tick')){
    tick = document.createElement('span');
    tick.className = 'saved-tick';
    inputEl.insertAdjacentElement('afterend', tick);
  }
  tick.textContent = 'Saved';
  tick.classList.add('show');
  clearTimeout(tick._t);
  tick._t = setTimeout(function(){ tick.classList.remove('show'); }, 1300);
}

async function quickPost(){
  if(!me){ goToAuth(); return; }
  var slug = (fieldData && fieldData.theme && fieldData.theme.circleSlug) || (circlesCache[0] && circlesCache[0].slug);
  if(!slug){ await navigate('circles'); return; }
  await navigate('circleThreads', { circle: slug });
  showNewThreadForm(slug);
}
function onClick(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  if(action==='select-type'){ selectObType(el.dataset.type, el); }
  else if(action==='auth-tab'){ switchAuthTab(el.dataset.mode); }
  else if(action==='submit-auth'){ submitAuth(); }
  else if(action==='browse-guest'){ browseAsGuest(); }
  else if(action==='go-to-auth'){ goToAuth(); }
  else if(action==='show-privacy-policy'){ showLegal('privacy'); }
  else if(action==='show-user-agreement'){ showLegal('agreement'); }
  else if(action==='legal-back'){ legalBack(); }
  else if(action==='toggle-theme'){ toggleTheme(); }
  else if(action==='ask-logout'){ askLogout(); }
  else if(action==='confirm-logout'){ logout(); }
  else if(action==='ask-delete-account'){ document.getElementById('danger-zone').innerHTML = '<span style="color:var(--text-soft);">This removes your account and all content.</span> <span data-action="confirm-delete-account" style="color:var(--red);font-weight:700;">Delete account</span> · <span data-action="cancel-logout">Cancel</span>'; }
  else if(action==='confirm-delete-account'){ deleteCurrentAccount(); }
  else if(action==='cancel-logout'){ navigate(lastView, lastParams); }
  else if(action==='nav'){ navigate(el.dataset.view, {circle: el.dataset.circle, thread: el.dataset.thread, userId: el.dataset.userId}); }
  else if(action==='lp-tab'){ lpTab = el.dataset.tab; renderFieldHome(); }
  else if(action==='search-members'){ searchMembers(); }
  else if(action==='open-message-user'){ e.stopPropagation(); openMessageUser(el.dataset.userId, el.dataset.userName); }
  else if(action==='load-message-thread'){ loadMessageThread(); }
  else if(action==='clear-message-thread'){ navigate('messages'); }
  else if(action==='send-direct-message'){ sendDirectMessage(el.dataset.userId); }
  else if(action==='toggle-acc'){ var idx=+el.dataset.idx; accOpen[idx] = !accOpen[idx]; renderFieldHome(); }
  else if(action==='show-new-thread'){ showNewThreadForm(el.dataset.circle); }
  else if(action==='cancel-new-thread'){ document.getElementById('new-thread-form').innerHTML=''; }
  else if(action==='submit-thread'){ submitThread(el.dataset.circle); }
  else if(action==='submit-reply'){ submitReply(el.dataset.thread); }
  else if(action==='mark-helpful'){ markHelpful(el.dataset.thread, el.dataset.reply); }
  else if(action==='toggle-thread-like'){ e.stopPropagation(); toggleThreadLike(el.dataset.thread, el); }
  else if(action==='toggle-reply-like'){ e.stopPropagation(); toggleReplyLike(el.dataset.thread, el.dataset.reply, el); }
  else if(action==='save-avatar'){
    var fileInput = document.getElementById('avatar-file-input');
    var errEl = document.getElementById('avatar-error');
    if(errEl) errEl.textContent = '';

    var pendingAvatarUrl = '';
    var readAndSave = (fileInput && fileInput.files.length > 0)
      ? new Promise(function(resolve, reject) {
          var reader = new FileReader();
          reader.onload = function(e) { resolve(e.target.result); };
          reader.onerror = function() { reject(new Error('Could not read that file. Please try a different image.')); };
          reader.readAsDataURL(fileInput.files[0]);
        }).then(function(base64Image) {
          pendingAvatarUrl = base64Image;
          return apiFetch('/users/me', {method:'PATCH', body:{avatarUrl: base64Image}});
        })
      : apiFetch('/users/me', {method:'PATCH', body:{avatarUrl: ''}});

    readAndSave
      .then(function(){
        me.avatarUrl = pendingAvatarUrl;
        var avatarEl = document.getElementById('profile-avatar');
        if(avatarEl){
          avatarEl.style.backgroundImage = pendingAvatarUrl ? "url('"+pendingAvatarUrl+"')" : '';
          avatarEl.textContent = pendingAvatarUrl ? '' : initialsOf(me.name);
        }
        if(fileInput) fileInput.value = '';
      })
      .catch(function(err){
        var slot = document.getElementById('avatar-error');
        if(slot) slot.textContent = (err && err.message) || 'Unable to save profile picture.';
      });
  }
  else if(action==='show-project-form'){ showProjectForm(); }
  else if(action==='cancel-project-form'){ document.getElementById('project-form-slot').innerHTML=''; }
  else if(action==='submit-project'){ submitProject(); }
  else if(action==='show-opportunity-form'){ showOpportunityForm(); }
  else if(action==='cancel-opportunity-form'){ document.getElementById('opportunity-form-slot').innerHTML=''; }
  else if(action==='submit-opportunity'){ submitOpportunity(); }
  else if(action==='remove-project'){ removeProject(el.dataset.id); }
  else if(action==='add-learning'){ addSkill('learning','add-learning'); }
  else if(action==='add-can'){ addSkill('can_demonstrate','add-can'); }
  else if(action==='remove-skill'){ removeSkill(el.dataset.id); }
  else if(action==='set-workpref'){ setCareerField('workPref', el.dataset.value); }
  else if(action==='set-availability'){ setCareerField('availability', el.dataset.value); }
  else if(action==='toggle-milestone'){ toggleMilestone(el.dataset.id); }
  else if(action==='edit-name'){ showNameEdit(); }
  else if(action==='save-name'){ saveNameEdit(); }
  else if(action==='save-profile-meta'){ saveProfileMeta(); }
  else if(action==='toggle-interest'){ toggleInterest(el.dataset.id); }
  else if(action==='filter-opp'){ oppFilter = el.dataset.filter; renderOpportunities(); }
  else if(action==='select-field'){ selectField(el.dataset.field); }
  else if(action==='quick-post'){ quickPost(); }
  else if(action==='save-settings'){ saveSettings(); }
}
function onFocusOut(e){
  var el = e.target.closest('[data-blur-action]');
  if(!el) return;
  var action = el.dataset.blurAction;
  if(action==='save-goal'){ apiFetch('/users/me', {method:'PATCH', body:{goal: el.value.trim()}}).then(function(){ me.goal = el.value.trim(); flashSaved(el); }); }
  else if(action==='save-target-role'){ apiFetch('/users/me', {method:'PATCH', body:{targetRole: el.value.trim()}}).then(function(){ me.careerGoals.targetRole = el.value.trim(); flashSaved(el); }); }
}
function onKeydown(e){
  if(e.key==='Enter'){
    var enterEl = e.target.closest('[data-enter-action]');
    if(enterEl){
      var action = enterEl.dataset.enterAction;
      if(action==='add-learning') addSkill('learning','add-learning');
      else if(action==='add-can') addSkill('can_demonstrate','add-can');
      else if(action==='search-members') searchMembers();
      else if(action==='submit-auth') submitAuth();
      return;
    }
    if(e.target && (e.target.id === 'global-search-input' || e.target.classList.contains('m-search-input'))){
      e.preventDefault();
      var q = (e.target.value || '').trim();
      if(q){ navigate('search', { q: q }); }
      return;
    }
  }
  if(e.key==='Enter' || e.key===' '){
    var el = e.target.closest('[data-action]');
    if(el && ['INPUT','TEXTAREA','BUTTON','SELECT'].indexOf(el.tagName)===-1){
      e.preventDefault();
      el.click();
    }
  }
}

document.body.addEventListener('click', onClick);
document.body.addEventListener('focusout', onFocusOut);
document.body.addEventListener('keydown', onKeydown);

var focusObserver = new MutationObserver(function(){ enhanceFocusability(); });
focusObserver.observe(document.getElementById('app'), {childList:true, subtree:true});

/* ============ INIT ============ */
async function waitForStorage(maxWaitMs){
  var waited = 0;
  while(typeof window.storage === 'undefined' && waited < maxWaitMs){
    await new Promise(function(r){ setTimeout(r, 50); });
    waited += 50;
  }
}
async function init(){
  await waitForStorage(1000);
  var savedToken = await loadToken();
  if(savedToken){
    token = savedToken;
    try{
      me = await apiFetch('/users/me');
      await enterApp();
      return;
    }catch(e){
      // If the 401 handler already rendered the auth screen (with its
      // "session expired" message), don't overwrite it.
      if(document.getElementById('authscreen')) return;
    }
  }
  renderAuthScreen();
}
init();

})();
